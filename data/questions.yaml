  options:
  - label_en: 42%
    label_fa: ٪۴۲
  - label_en: 54%
    label_fa: ٪۵۴
  - label_en: 66%
    label_fa: ٪۶۶
  - label_en: 78%
    label_fa: ٪۷۸
