- id: q-housing-01
  category: housing
  difficulty: 1
  surprise_note: Widely reported census figure; most players know ownership is around three-fifths
  prompt_en: What share of Iranian households own their home (2016 census, national)?
  prompt_fa: بر اساس سرشماری ۱۳۹۵، چند درصد از خانوارهای ایرانی مالک خانه‌شان هستند؟
  stat_ids:
  - home-ownership-national-2016
  correct_index: 1
  fun_fact_en: The census value is 60.5% — but in cities it falls to about 54%.
  fun_fact_fa: عدد سرشماری ۶۰٫۵٪ است — اما در شهرها به حدود ۵۴٪ می‌رسد.
  options:
  - label_en: 40%
    label_fa: ٪۴۰
  - label_en: 60%
    label_fa: ٪۶۰
  - label_en: 75%
    label_fa: ٪۷۵
  - label_en: 90%
    label_fa: ٪۹۰
